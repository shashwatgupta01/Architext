<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Blog</title>
    <link rel="stylesheet" href="public/main.css" />
</head>
<body>
    <header>
        <h1>Architecture Insights</h1>
        <p>Exploring the beauty and functionality of architectural design</p>
    </header>
    <nav>
        <div>
            <a href="blog.html">Blog</a>
            <a href="videos.html">Videos</a>
            <a href="people.html">People</a>
            <a href="profileview.html">View Profile</a>
            <a href="profile.html">Edit Profile</a>
            <a href="chat.html">Chat</a>
        </div>
        <div>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="search-blog">
            <input type="text" id="blogSearch" placeholder="Search blogs by keyword..." />
            <button onclick="searchBlogs()">Search</button>
        </div>

        <div class="create-blog">
            <h2>Create a New Blog Post</h2>
            <form id="createBlogForm">
                <input type="text" name="title" placeholder="Blog Title" required />
                <textarea name="content" placeholder="Blog Content" required></textarea>
                <input type="text" name="keywords" placeholder="Keywords (hastags)" required />
                <input type="text" name="image" placeholder="Image URL" />
                <button type="submit">Post Blog</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Architext. All rights reserved.</p>
    </footer>

    <script>
        const createBlogForm = document.getElementById('createBlogForm');
        createBlogForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const title = this.title.value.trim();
            const content = this.content.value.trim();
            const keywords = this.keywords.value.trim();
            const image = this.image.value.trim();
            const username = localStorage.getItem('currentUser');

            if (!username) {
                alert('You must be logged in to post a blog.');
                return;
            }

            fetch('/add-blog', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, title, content, keywords, image })
            })
            .then(response => {
                if (response.ok) {
                    alert('Blog posted successfully!');
                    fetchBlogs(); // Reload blogs after posting
                } else {
                    return response.json().then(data => {
                        alert(data.message || 'Failed to post blog.');
                    });
                }
            })
            .catch(() => alert('Error posting blog.'));
        });

        function fetchBlogs() {
            fetch('/blogs')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch blogs');
                    return response.json();
                })
                .then(blogs => {
                    const blogContainer = document.querySelector('.container');
                    const blogPosts = blogContainer.querySelectorAll('.blog-post, .no-results');
                    blogPosts.forEach(post => post.remove());

                    const createBlogForm = document.querySelector('.create-blog');

                    blogs.forEach(blog => {
                        const blogElement = document.createElement('div');
                        blogElement.className = 'blog-post';
                        blogElement.innerHTML = `
                            <h2 style="text-decoration: underline;">${blog.title}</h2>
                            <p><strong>Posted by:</strong> ${blog.username}</p>
                            ${blog.image ? `<div><img src="${blog.image}" alt="Blog Image" style="max-width: 90%; height: auto; margin-bottom: 20px;" /></div>` : ''}
                            <p>${blog.content}</p>
                            <p><strong>Keywords:</strong> ${blog.keywords}</p>
                            <button class="comment-button" data-blog-id="${blog.id}">💬 Comment</button>
                            <button class="like-button" data-blog-id="${blog.id}">❤️ Like</button>
                            <button class="view-likes-button" data-blog-id="${blog.id}">👀 View Likes</button>
                            ${localStorage.getItem('currentUser') === blog.username ? `<button class="delete-button" data-blog-id="${blog.id}">🗑️ Delete</button>` : ''}
                            <div class="comments-section" id="comments-${blog.id}">
                                <h4>Comments:</h4>
                                <ul class="comments-list"></ul>
                            </div>
                        `;
                        blogContainer.insertBefore(blogElement, createBlogForm);

                        // Fetch and display comments for the blog post
                        fetch(`/comments/${blog.id}`)
                            .then(response => response.json())
                            .then(comments => {
                                const commentsList = document.querySelector(`#comments-${blog.id} .comments-list`);
                                comments.forEach(comment => {
                                    const commentItem = document.createElement('li');
                                    commentItem.textContent = `${comment.username}: ${comment.comments}`;
                                    commentsList.appendChild(commentItem);
                                });
                            })
                            .catch(error => console.error('Error fetching comments:', error));
                    });

                    document.querySelectorAll('.like-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            fetch('/like-blog', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ blogId, username: localStorage.getItem('currentUser') })
                            })
                            .then(response => {
                                if (response.ok) {
                                    alert('Blog liked successfully!');
                                } else {
                                    alert('You have already liked this blog.');
                                }
                            })
                            .catch(() => alert('Error liking blog.'));
                        });
                    });

                    document.querySelectorAll('.view-likes-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            fetch(`/blog-likes/${blogId}`)
                                .then(response => {
                                    if (!response.ok) throw new Error('Failed to fetch likes');
                                    return response.json();
                                })
                                .then(users => {
                                    if (users.length === 0) {
                                        alert('No one has liked this blog yet.');
                                    } else {
                                        alert(`Users who liked this blog: ${users.map(user => user.username).join(', ')}`);
                                    }
                                })
                                .catch(() => alert('Error fetching likes.'));
                        });
                    });

                    document.querySelectorAll('.comment-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            const comment = prompt('Enter your comment:');
                            if (comment) {
                                fetch('/add-comment', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ blogId, username: localStorage.getItem('currentUser'), comments: comment })
                                })
                                .then(response => {
                                    if (response.ok) {
                                        alert('Comment added successfully!');
                                    } else {
                                        alert('Failed to add comment.');
                                    }
                                })
                                .catch(() => alert('Error adding comment.'));
                            }
                        });
                    });

                    document.querySelectorAll('.delete-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            if (confirm('Are you sure you want to delete this blog post?')) {
                                fetch(`/delete-blog/${blogId}`, {
                                    method: 'DELETE',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ username: localStorage.getItem('currentUser') })
                                })
                                .then(response => {
                                    if (response.ok) {
                                        alert('Blog post deleted successfully!');
                                        fetchBlogs(); // Reload blogs after deletion
                                    } else {
                                        alert('Failed to delete blog post.');
                                    }
                                })
                                .catch(() => alert('Error deleting blog post.'));
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error fetching blogs:', error);
                    alert('Error fetching blogs. Please try again later.');
                });
        }

        function searchBlogs() {
            const keyword = document.getElementById('blogSearch').value.trim();

            if (!keyword) {
                alert('Please enter a keyword to search.');
                return;
            }

            fetch(`/search-blogs?keyword=${encodeURIComponent(keyword)}`)
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch blogs');
                    return response.json();
                })
                .then(blogs => {
                    const blogContainer = document.querySelector('.container');
                    const blogPosts = blogContainer.querySelectorAll('.blog-post, .no-results');
                    blogPosts.forEach(post => post.remove());

                    const createBlogForm = document.querySelector('.create-blog');

                    if (blogs.length === 0) {
                        const noResults = document.createElement('p');
                        noResults.textContent = 'No blogs found for the given keyword.';
                        noResults.className = 'no-results';
                        blogContainer.insertBefore(noResults, createBlogForm);
                        return;
                    }

                    blogs.forEach(blog => {
                        const blogElement = document.createElement('div');
                        blogElement.className = 'blog-post';
                        blogElement.innerHTML = `
                            <h2 style="text-decoration: underline;">${blog.title}</h2>
                            <p><strong>Posted by:</strong> ${blog.username}</p>
                            ${blog.image ? `<div><img src="${blog.image}" alt="Blog Image" style="max-width: 100%; height: auto;" /><p>${blog.title}</p></div>` : ''}
                            <p>${blog.content}</p>
                            <p><strong>Keywords:</strong> ${blog.keywords}</p>
                            <button class="comment-button" data-blog-id="${blog.id}">💬 Comment</button>
                            <button class="like-button" data-blog-id="${blog.id}">❤️ Like</button>
                            <button class="view-likes-button" data-blog-id="${blog.id}">👀 View Likes</button>
                            ${localStorage.getItem('currentUser') === blog.username ? `<button class="delete-button" data-blog-id="${blog.id}">🗑️ Delete</button>` : ''}
                            <div class="comments-section" id="comments-${blog.id}">
                                <h4>Comments:</h4>
                                <ul class="comments-list"></ul>
                            </div>
                        `;
                        blogContainer.insertBefore(blogElement, createBlogForm);

                        // Fetch and display comments for the blog post
                        fetch(`/comments/${blog.id}`)
                            .then(response => response.json())
                            .then(comments => {
                                const commentsList = document.querySelector(`#comments-${blog.id} .comments-list`);
                                comments.forEach(comment => {
                                    const commentItem = document.createElement('li');
                                    commentItem.textContent = `${comment.username}: ${comment.comments}`;
                                    commentsList.appendChild(commentItem);
                                });
                            })
                            .catch(error => console.error('Error fetching comments:', error));
                    });

                    document.querySelectorAll('.like-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            fetch('/like-blog', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ blogId, username: localStorage.getItem('currentUser') })
                            })
                            .then(response => {
                                if (response.ok) {
                                    alert('Blog liked successfully!');
                                } else {
                                    alert('You have already liked this blog.');
                                }
                            })
                            .catch(() => alert('Error liking blog.'));
                        });
                    });

                    document.querySelectorAll('.view-likes-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            fetch(`/blog-likes/${blogId}`)
                                .then(response => {
                                    if (!response.ok) throw new Error('Failed to fetch likes');
                                    return response.json();
                                })
                                .then(users => {
                                    if (users.length === 0) {
                                        alert('No one has liked this blog yet.');
                                    } else {
                                        alert(`Users who liked this blog: ${users.map(user => user.username).join(', ')}`);
                                    }
                                })
                                .catch(() => alert('Error fetching likes.'));
                        });
                    });

                    document.querySelectorAll('.comment-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            const comment = prompt('Enter your comment:');
                            if (comment) {
                                fetch('/add-comment', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ blogId, username: localStorage.getItem('currentUser'), comments: comment })
                                })
                                .then(response => {
                                    if (response.ok) {
                                        alert('Comment added successfully!');
                                    } else {
                                        alert('Failed to add comment.');
                                    }
                                })
                                .catch(() => alert('Error adding comment.'));
                            }
                        });
                    });

                    document.querySelectorAll('.delete-button').forEach(button => {
                        button.addEventListener('click', () => {
                            const blogId = button.getAttribute('data-blog-id');
                            if (confirm('Are you sure you want to delete this blog post?')) {
                                fetch(`/delete-blog/${blogId}`, {
                                    method: 'DELETE',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ username: localStorage.getItem('currentUser') })
                                })
                                .then(response => {
                                    if (response.ok) {
                                        alert('Blog post deleted successfully!');
                                        fetchBlogs(); // Reload blogs after deletion
                                    } else {
                                        alert('Failed to delete blog post.');
                                    }
                                })
                                .catch(() => alert('Error deleting blog post.'));
                            }
                        });
                    });
                })
                .catch(error => {
                    console.error('Error searching blogs:', error);
                    alert('Error searching blogs. Please try again later.');
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchBlogs();
            fetch('/blogs')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch blogs');
                    return response.json();
                })
                .then(blogs => {
                    console.log('Blogs:', blogs); // Print all blog info to the terminal
                })
                .catch(error => {
                    console.error('Error fetching blogs:', error);
                });
        });
    </script>
</body>
</html>
