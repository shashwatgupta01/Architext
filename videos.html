<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Blog</title>
    <link rel="stylesheet" href="public/main.css" />
</head>
<body>
    <header>
        <h1>Architecture Insights</h1>
        <p>Exploring the beauty and functionality of architectural design</p>
    </header>
    <nav>
        <div>
            <a href="blog.html">Blog</a>
            <a href="videos.html">Videos</a>
            <a href="people.html">People</a>
            <a href="profileview.html">View Profile</a>
            <a href="profile.html">Edit Profile</a>
            <a href="chat.html">Chat</a>
        </div>
        <div>
            <a href="login.html">Logout</a>
        </div>
    </nav>
    <div class="search-videos">
        <input type="text" id="videoSearch" placeholder="Search videos..." />
        <button onclick="searchVideos()">Search</button>
    </div>
    <div id="reels" class="reels-container"></div>
    <footer>
        <p>&copy; 2025 Architext. All rights reserved.</p>
    </footer>
    <script>
        const reelsContainer = document.getElementById('reels');
        
        async function loadReels() {
        const apiKey = 'AIzaSyCxTttR9-vd7ZUpZp3DFPQZ9SOv1N-Bkbc';
        const query = 'architecture';
        const maxResults = 24;
        
        const url = `https://www.googleapis.com/youtube/v3/search?key=${apiKey}&type=video&part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&videoDuration=short`;
        
        try {
        const response = await fetch(url);
        const data = await response.json();
        
        if (!data.items || data.items.length === 0) {
        reelsContainer.innerHTML = '<p>No reels found.</p>';
        return;
        }
        
        data.items.forEach(item => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        const thumbnail = item.snippet.thumbnails.medium.url;
        
        const reelDiv = document.createElement('div');
        reelDiv.classList.add('reel');
        reelDiv.innerHTML = `
        <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">
        <img src="${thumbnail}" alt="${title}">
        <div class="reel-title">${title}</div>
        </a>
        `;
        reelsContainer.appendChild(reelDiv);
        });
        } catch (error) {
        console.error('Error fetching YouTube reels:', error);
        reelsContainer.innerHTML = '<p>Error loading reels. Please try again later.</p>';
        }
        }
        
        loadReels();

        function searchVideos() {
            const searchQuery = document.getElementById('videoSearch').value.trim();
            if (!searchQuery) {
                alert('Please enter a search term.');
                return;
            }

            const apiKey = 'AIzaSyDwQ54m_EGoGGqAp2Z_1mN3QuBdI9j80eo';
            const query = `${searchQuery} architecture`;
            const maxResults = 24;

            const url = `https://www.googleapis.com/youtube/v3/search?key=${apiKey}&type=video&part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&videoDuration=short`;

            reelsContainer.innerHTML = '<p>Loading...</p>';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    reelsContainer.innerHTML = '';

                    if (!data.items || data.items.length === 0) {
                        reelsContainer.innerHTML = '<p>No videos found.</p>';
                        return;
                    }

                    data.items.forEach(item => {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const thumbnail = item.snippet.thumbnails.medium.url;

                        const reelDiv = document.createElement('div');
                        reelDiv.classList.add('reel');
                        reelDiv.innerHTML = `
                            <a href="https://www.youtube.com/watch?v=${videoId}" target="_blank">
                                <img src="${thumbnail}" alt="${title}">
                                <div class="reel-title">${title}</div>
                            </a>
                        `;
                        reelsContainer.appendChild(reelDiv);
                    });
                })
                .catch(error => {
                    console.error('Error fetching YouTube videos:', error);
                    reelsContainer.innerHTML = '<p>Error loading videos. Please try again later.</p>';
                });
        }
    </script>
</body>
</html>
