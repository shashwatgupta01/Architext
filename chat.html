<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="public/main.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
        }

        .chat-header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            max-height: 400px;
            border-bottom: 1px solid #ccc;
        }

        .chat-message {
            margin-bottom: 10px;
        }

        .chat-message .sender {
            font-weight: bold;
        }

        .chat-input {
            display: flex;
            padding: 10px;
            background-color: #f9f9f9;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }

        .chat-input button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .chat-input button:hover {
            background-color: #45a049;
        }

        .user-list {
            margin: 20px auto;
            max-width: 600px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .user-list h3 {
            margin-bottom: 10px;
        }

        .user-list button {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .user-list button:hover {
            background-color: #0056b3;
        }

        .delete-chat-button {
            background-color: #FF0000;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 5px;
        }

        .delete-chat-button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <header>
        <h1>Architecture Insights</h1>
        <p>Exploring the beauty and functionality of architectural design</p>
    </header>
    <nav>
        <div>
            <a href="blog.html">Blog</a>
            <a href="videos.html">Videos</a>
            <a href="people.html">People</a>
            <a href="profileview.html">View Profile</a>
            <a href="profile.html">Edit Profile</a>
            <a href="chat.html">Chat</a>
        </div>
        <div>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <div class="user-list">
        <h3>Start a New Chat</h3>
        <div id="userList"></div>
    </div>

    <div class="chat-container" id="chatContainer" style="display: none;">
        <div class="chat-header" id="chatHeader">Chat</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button id="sendMessageButton">Send</button>
        </div>
    </div>

    <script>
        const userList = document.getElementById('userList');
        const chatContainer = document.getElementById('chatContainer');
        const chatHeader = document.getElementById('chatHeader');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendMessageButton = document.getElementById('sendMessageButton');

        let currentChatUser = null;

        function loadUsers() {
            const currentUser = localStorage.getItem('currentUser');
            fetch(`/all-users?currentUser=${encodeURIComponent(currentUser)}`)
                .then(response => response.json())
                .then(users => {
                    userList.innerHTML = '';
                    users.forEach(user => {
                        const button = document.createElement('button');
                        button.textContent = user.username;
                        button.addEventListener('click', () => startChat(user.username));
                        userList.appendChild(button);
                    });
                });
        }

        function startChat(username) {
            currentChatUser = username;
            chatHeader.textContent = `Chat with ${username}`;
            chatContainer.style.display = 'flex';
            loadMessages(username);
        }

        function loadMessages(username) {
            fetch(`/messages/${localStorage.getItem('currentUser')}/${username}`)
                .then(response => response.json())
                .then(messages => {
                    chatMessages.innerHTML = '';
                    messages.forEach(message => {
                        const messageElement = document.createElement('div');
                        messageElement.className = 'chat-message';
                        messageElement.innerHTML = `<span class="sender">${message.sender}:</span> ${message.message}`;

                        if (message.sender === localStorage.getItem('currentUser')) {
                            const deleteButton = document.createElement('button');
                            deleteButton.textContent = '🗑️';
                            deleteButton.className = 'delete-message-button';
                            deleteButton.addEventListener('click', () => {
                                if (confirm('Are you sure you want to delete this message?')) {
                                    fetch(`/delete-message/${message.id}`, {
                                        method: 'DELETE'
                                    })
                                    .then(response => {
                                        if (response.ok) {
                                            alert('Message deleted successfully!');
                                            loadMessages(username);
                                        } else {
                                            alert('Failed to delete message.');
                                        }
                                    })
                                    .catch(() => alert('Error deleting message.'));
                                }
                            });
                            messageElement.appendChild(deleteButton);
                        }

                        chatMessages.appendChild(messageElement);
                    });
                });
        }

        sendMessageButton.addEventListener('click', () => {
            const message = chatInput.value.trim();
            if (!message) return;

            fetch('/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sender: localStorage.getItem('currentUser'),
                    receiver: currentChatUser,
                    message
                })
            })
                .then(response => {
                    if (response.ok) {
                        chatInput.value = '';
                        loadMessages(currentChatUser);
                    }
                });
        });

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
